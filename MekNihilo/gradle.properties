# NOTE: org.gradle.jvmargs is deliberately NOT set here. Setting it makes Gradle
# fork a single-use daemon, which fails in this sandboxed environment where
# child-process pipes are blocked. Heap is supplied via GRADLE_OPTS instead
# (see build.ps1), which applies to the launcher JVM directly.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# Mod metadata
mod_id=mekexnihilo
mod_name=MekExNihilo
mod_license=MIT
mod_version=1.0.5
mod_group_id=com.mekexnihilo
mod_authors=MekExNihilo
mod_description=MekExNihilo - an addon bridging Mekanism and Ex Deorum. Adds an electric sieve machine that processes Ex Deorum sifting recipes using any mesh tier.
mod_credits=

# Platform versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.249
neo_version_range=[21.1.249,)
loader_version_range=[4,)

# Dependency versions
mekanism_version=1.21.1-10.7.11.76
mekanism_version_range=[10.7.11,)
# Compiled and tested against Ex Deorum 3.10.
exdeorum_version=3.3
exdeorum_version_range=[3.3,)
