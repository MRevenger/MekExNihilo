# Heap is set through GRADLE_OPTS in build.ps1 rather than org.gradle.jvmargs, because
# setting jvmargs forces Gradle to fork a single-use daemon. See build.ps1.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# Mod metadata
mod_id=mekexnihilo
mod_name=MekExNihilo
mod_license=MIT
mod_version=1.0.7
mod_group_id=com.mekexnihilo
mod_authors=MRevenger
mod_description=An addon bridging Mekanism and Ex Deorum. Adds an electric sieve machine and four factory tiers that process Ex Deorum sifting recipes using any mesh tier.
mod_credits=

# Platform versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.249
neo_version_range=[21.1.249,)
loader_version_range=[4,)

# Dependency versions
mekanism_version=1.21.1-10.7.11.76
mekanism_version_range=[10.7.11,)
# Compiled and tested against Ex Deorum 3.3; the API surface of 3.3 through 3.12 was checked.
exdeorum_version=3.3
exdeorum_version_range=[3.3,)
